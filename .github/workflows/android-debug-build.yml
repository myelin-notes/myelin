name: Android Debug Build

# On-demand debuggable Android APK for testing on a physical tablet. Produces a
# workflow artifact; it is never uploaded to a release. Built with `--debug`, so
# the APK is debuggable and the WebView accepts remote debugging — attach desktop
# Chrome via chrome://inspect over USB to record a Performance timeline.
#
# The APK is signed with Gradle's auto-generated debug keystore, not the release
# key, so it cannot install over an existing release build: uninstall that first.
#
# `play` instead builds a release-signed, non-debuggable AAB/APK for Play internal
# testing. It must run on a preview-* branch and talks to that branch's Pages
# preview, so purchases go through Polar's sandbox rather than production.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or SHA to build (defaults to the ref the workflow is run from)
        required: false
        default: ''
      target:
        description: ABI to build (x86_64 for emulators)
        required: false
        default: aarch64
        type: choice
        options: [aarch64, armv7, x86_64, i686]
      play:
        description: Release-signed, non-debuggable build for Play internal testing
        required: false
        default: false
        type: boolean

concurrency:
  group: android-debug-build-${{ github.event.inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (android debug)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NDK_VERSION: 26.3.11579264
      VITE_TABLET_LAYOUT: "true"
      VITE_GITHUB_CLIENT_SECRET: ${{ secrets.VITE_GITHUB_CLIENT_SECRET }}
      VITE_GOOGLE_CLIENT_SECRET: ${{ secrets.VITE_GOOGLE_CLIENT_SECRET }}
      PLAY: ${{ github.event.inputs.play == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0 ndk;${{ env.NDK_VERSION }}'

      # See release.yml: without these, cargo-mobile's NDK resolver picks the
      # newest NDK the runner image ships instead of the pinned one.
      - name: Pin NDK
        run: |
          NDK_PATH="$ANDROID_HOME/ndk/$NDK_VERSION"
          test -d "$NDK_PATH" || { echo "::error::pinned NDK not found at $NDK_PATH"; exit 1; }
          for v in ANDROID_NDK_HOME ANDROID_NDK_ROOT ANDROID_NDK ANDROID_NDK_LATEST_HOME NDK_HOME; do
            echo "$v=$NDK_PATH" >> "$GITHUB_ENV"
          done
          echo "$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      # Separate key from the release job: the dev profile writes different
      # artifacts into the same target dir and the two would evict each other.
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: android-debug-${{ github.event.inputs.play == 'true' && 'play' || 'debug' }}

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # `tauri android build` rejects the versionCode 0 derived from the repo's
      # permanent 0.0.0 dev version, so stamp a valid one.
      - name: Set version
        run: node scripts/set-version.mjs 0.0.1

      - name: Init Android project
        run: |
          if [ ! -d src-tauri/gen/android ]; then
            yarn tauri android init
          fi

      - name: Configure Play build
        if: env.PLAY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          BRANCH=$(git rev-parse --abbrev-ref HEAD)
          if [[ "$BRANCH" != preview-* ]]; then
            echo "::error::play builds must run on a preview-* branch so they use Polar's sandbox (got $BRANCH)"
            exit 1
          fi
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is unset"
            exit 1
          fi
          # Same alias rule as scripts/tauri.mjs.
          ALIAS=$(echo "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g' | cut -c1-28)
          echo "VITE_WEBSITE_URL=https://$ALIAS.myelin-3lc.pages.dev" >> "$GITHUB_ENV"
          # Slots between release.yml's codes (1000000 + run * 100 + attempt), so this lands above
          # the last release and below the next. shortcut: wraps after 49 play builds per release.
          RELEASE_RUN=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow release.yml --limit 1 --json number -q '.[0].number')
          echo "VERSION_CODE=$((1000000 + RELEASE_RUN * 100 + 50 + GITHUB_RUN_NUMBER % 49))" >> "$GITHUB_ENV"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > src-tauri/gen/android/release.keystore
          cat > src-tauri/gen/android/keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      # See release.yml for the full story: a warm Rust cache makes the `cmake`
      # crate re-configure whisper-rs-sys's restored build dir, which resets the
      # CMake cache and fails on whisper.cpp's missing examples/ dir.
      - name: Purge cached whisper-rs-sys build (avoid stale CMake cache reset)
        run: |
          find src-tauri/target -type d -name 'whisper-rs-sys*' -prune -exec rm -rf {} + 2>/dev/null || true
          echo "Purged whisper-rs-sys build + fingerprint dirs"

      - name: Build Android
        env:
          # Both from release.yml: 16 KB page alignment keeps the native libs
          # loadable on 16 KB-page devices, and the bindgen sysroot stops
          # whisper-rs-sys falling back to its bundled 64-bit bindings.
          CARGO_ENCODED_RUSTFLAGS: -Clink-arg=-Wl,-z,max-page-size=16384
          BINDGEN_EXTRA_CLANG_ARGS: --sysroot=${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}/toolchains/llvm/prebuilt/linux-x86_64/sysroot
          # The Tauri-generated gradle keeps debug symbols in jniLibs rather
          # than letting AGP strip them, so a stock dev profile ships an 820 MB
          # libmyelin_lib.so in a 936 MB APK. Drop debuginfo and optimize: the
          # Rust side then runs at roughly release speed, which matters because
          # this build is used to diagnose performance. `debug-assertions` stays
          # on (dev profile default), so wry still enables WebView remote
          # debugging — that is what makes this build worth shipping.
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_DEV_OPT_LEVEL: "2"
        run: |
          TARGET=${{ github.event.inputs.target || 'aarch64' }}
          if [ "$PLAY" = true ]; then
            yarn tauri android build --config "{\"bundle\":{\"android\":{\"versionCode\":$VERSION_CODE}}}" --apk --aab --target "$TARGET"
          else
            yarn tauri android build --debug --apk --aab --target "$TARGET"
          fi

      - name: Upload APK and AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PLAY == 'true' && 'myelin-android-play' || 'myelin-android-debug' }}
          path: |
            src-tauri/gen/android/app/build/outputs/apk/*/*/*.apk
            src-tauri/gen/android/app/build/outputs/bundle/*/*.aab
          if-no-files-found: error
          retention-days: 14
