name: Release Build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or SHA to build
        required: true
        default: main

concurrency:
  group: release-${{ github.event.release.tag_name || github.event.inputs.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  NODE_OPTIONS: --max-old-space-size=4096
  # Defining SOURCE_DATE_EPOCH makes ggml (whisper.cpp, pulled in via scribble ->
  # whisper-rs) default GGML_NATIVE=OFF, so it builds a portable CPU baseline
  # instead of auto-detecting the build host's features. Required on the Apple
  # Silicon runners: native detection mis-enables the ARMv8.6 i8mm intrinsics and
  # the CPU backend fails to compile ("vmmlaq_s32 ... requires target feature
  # 'i8mm'"). It also keeps shipped binaries from assuming SIMD features that
  # users' machines may lack. whisper-rs-sys only forwards WHISPER_*/CMAKE_* env
  # vars to CMake, so this is the only knob that reaches GGML_NATIVE. Value just
  # needs to be a valid post-1980 epoch (2024-01-01 here).
  SOURCE_DATE_EPOCH: "1704067200"
  # Must match the updater endpoint host in src-tauri/tauri.conf.json.
  R2_BUCKET: myelin-updates
  UPDATER_DOMAIN: https://updates.trymyelin.app

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.event.inputs.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Typecheck
        run: yarn typecheck

      - name: Unit tests
        run: yarn test

  build:
    name: Build (${{ matrix.platform }}${{ matrix.args && format(' {0}', matrix.args) || '' }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.event.inputs.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: ${{ matrix.platform }}-${{ matrix.args }}

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Source maps for posthog-js exception symbolication. yarn build (run
          # by tauri-action) injects chunk IDs and uploads the maps via
          # scripts/posthog-sourcemaps.mjs. The key is only set on release
          # events, so workflow_dispatch test builds skip the upload.
          POSTHOG_CLI_API_KEY: ${{ github.event_name == 'release' && secrets.POSTHOG_CLI_API_KEY || '' }}
          POSTHOG_CLI_PROJECT_ID: ${{ secrets.POSTHOG_CLI_PROJECT_ID }}
          POSTHOG_CLI_HOST: https://us.posthog.com
        with:
          releaseId: ${{ github.event.release.id }}
          args: ${{ matrix.args }}

      - name: Stage updater artifacts
        shell: bash
        run: |
          mkdir -p updater-out
          # Copy every signed updater bundle alongside its .sig. Globbing by
          # .sig keeps us platform-agnostic: each .sig names its own bundle.
          # macOS is a single universal build, so its "<product>.app.tar.gz" no
          # longer collides across arches and needs no arch tagging (the manifest
          # builder maps the universal bundle to both darwin arch keys).
          while IFS= read -r sig; do
            bundle="${sig%.sig}"
            base="$(basename "$bundle")"
            cp "$bundle" "updater-out/$base"
            cp "$sig" "updater-out/$base.sig"
          done < <(find src-tauri/target -type f -name '*.sig')
          # Stage the macOS .dmg too: it's the human-facing installer the website
          # links to, not an updater artifact, so it rides along here to reach the
          # publish job. Exactly one universal dmg is produced.
          while IFS= read -r dmg; do
            cp "$dmg" "updater-out/$(basename "$dmg")"
          done < <(find src-tauri/target -type f -name '*.dmg')

      - name: Upload updater artifacts
        uses: actions/upload-artifact@v4
        with:
          name: updater-${{ matrix.platform }}${{ matrix.args && format('-{0}', matrix.args) || '' }}
          path: updater-out/
          if-no-files-found: error
          retention-days: 14

      - name: Upload workflow artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: myelin-${{ matrix.platform }}${{ matrix.args && format('-{0}', matrix.args) || '' }}
          path: |
            src-tauri/target/*/release/bundle/**/*
            src-tauri/target/release/bundle/**/*
          if-no-files-found: ignore
          retention-days: 14

  publish-prerelease:
    name: Publish prerelease to R2
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # R2 token (Object Read & Write) for the S3 prefix delete in
      # prune-channel.mjs; wrangler can't bulk-delete a folder.
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_S3_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Download updater artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: updater-*
          path: incoming
          merge-multiple: true

      - name: Assemble manifest
        run: |
          # tauri.conf.json's version is the path-reference form ("../package.json"),
          # so read the resolved semver from package.json directly.
          VERSION=$(node -p "require('./package.json').version")
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "::error::resolved VERSION is not a semver: '$VERSION'"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          node scripts/build-updater-manifest.mjs \
            --dir incoming \
            --version "$VERSION" \
            --base-url "$UPDATER_DOMAIN/prerelease/$VERSION" \
            --out latest.json
          cat latest.json

      - name: Prune old prerelease versions
        run: node scripts/prune-channel.mjs prerelease

      - name: Upload bundles + manifest to R2
        run: |
          # Upload every artifact we built: the updater bundles (.app.tar.gz /
          # -setup.exe / .AppImage) with their .sig sidecars, plus the macOS .dmg.
          # The .dmg is the human-facing installer the website links to; it isn't
          # an updater artifact (absent from latest.json), so it goes up under a
          # fixed name the website and promote step can find. Everything else keeps
          # its own name and is discoverable straight from the manifest.
          for f in incoming/*; do
            [ -e "$f" ] || continue
            name="$(basename "$f")"
            case "$name" in
              *.dmg) name="Myelin-macOS.dmg" ;;
            esac
            npx --yes wrangler@4 r2 object put \
              "$R2_BUCKET/prerelease/$VERSION/$name" --file "$f" --remote
          done
          # Versioned copy lets promotion later fetch this exact version's manifest.
          npx --yes wrangler@4 r2 object put \
            "$R2_BUCKET/prerelease/$VERSION/latest.json" --file latest.json --remote
          # The channel-root manifest is the live switch the app polls. Upload last.
          npx --yes wrangler@4 r2 object put \
            "$R2_BUCKET/prerelease/latest.json" --file latest.json --remote

  android:
    name: Build (android)
    needs: test
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 26.3.11579264
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.event.inputs.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0 ndk;${{ env.NDK_VERSION }}'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: android

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Init Android project
        run: |
          if [ ! -d src-tauri/gen/android ]; then
            yarn tauri android init
          fi
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}

      - name: Decode Android keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > src-tauri/gen/android/release.keystore
          cat > src-tauri/gen/android/keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Build Android
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}
        run: yarn tauri android build --apk --aab

      - name: Upload to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          shopt -s nullglob
          files=(src-tauri/gen/android/app/build/outputs/apk/**/*.apk src-tauri/gen/android/app/build/outputs/bundle/**/*.aab)
          if [ ${#files[@]} -gt 0 ]; then
            gh release upload "$TAG" "${files[@]}" --clobber
          fi

      - name: Upload workflow artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: myelin-android
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            src-tauri/gen/android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: warn
          retention-days: 14

  ios:
    name: Build (ios)
    needs: test
    runs-on: macos-latest
    continue-on-error: true
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.event.inputs.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: ios

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Init iOS project
        run: |
          if [ ! -d src-tauri/gen/apple ]; then
            yarn tauri ios init
          fi

      - name: Import signing certificate
        if: env.APPLE_CERTIFICATE != ''
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Install provisioning profile
        if: env.APPLE_PROVISIONING_PROFILE != ''
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$APPLE_PROVISIONING_PROFILE" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision

      - name: Build iOS
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
        run: |
          if [ -n "$APPLE_DEVELOPMENT_TEAM" ]; then
            yarn tauri ios build --export-method app-store-connect
          else
            yarn tauri ios build --export-method debugging
          fi

      - name: Upload to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          shopt -s nullglob
          files=(src-tauri/gen/apple/build/arm64/*.ipa src-tauri/gen/apple/build/**/*.ipa)
          if [ ${#files[@]} -gt 0 ]; then
            gh release upload "$TAG" "${files[@]}" --clobber
          fi

      - name: Upload workflow artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: myelin-ios
          path: |
            src-tauri/gen/apple/build/**/*.ipa
          if-no-files-found: warn
          retention-days: 14
