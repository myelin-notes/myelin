<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/icons/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Myelin Notes</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash of light mode.
      try {
        var t = JSON.parse(localStorage.getItem('myelin:theme') || '"system"');
        var dark =
          t === 'dark' ||
          (t === 'system' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
