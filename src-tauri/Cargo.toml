[package]
name = "myelin"
version = "0.0.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "myelin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2.3.3"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "io-util", "fs", "sync", "macros", "time", "process"] }
tauri-plugin-mcp-bridge = "0.12"
tauri-plugin-pencil = { path = "plugins/tauri-plugin-pencil" }
tauri-plugin-scoped-storage = "=1.5.1"
tauri-plugin-stronghold = "2"
tauri-plugin-http = "2"
iroh = "=1.0.3"
# iroh's own deps are caret ranges, so pinning `iroh` alone still lets `cargo update` float these
# to 1.1 (which changes CustomAddr serialization). Declared only to hold them.
iroh-base = "=1.0.3"
iroh-dns = "=1.0.3"
iroh-relay = "=1.0.3"
iroh-gossip = "0.101.0"
iroh-tickets = "1.0.0"
bytes = "1"
n0-future = "0.3.2"
sha2 = "0.10.9"
krilla = { version = "0.8.1", features = ["pdf"] }
base64 = "0.22.1"
onenote_parser = { version = "2", features = ["onepkg"] }
typed-path = "0.12"
yrs = "0.26.0"
scribble = "0.5.4"
tauri-plugin-deep-link = "2"
# Already in the tree via reqwest/iroh, so declaring them adds no build cost.
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
form_urlencoded = "1"
png = "0.18.1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
git2 = { version = "0.21", features = ["https", "vendored-libgit2", "vendored-openssl"] }
flate2 = "1"
tar = "0.4"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"

[features]
# Opt-in GPU acceleration via whisper.cpp's Vulkan backend. Kept off by default
# so ordinary local builds stay CPU-only and don't require the Vulkan SDK
# (whisper-rs-sys panics at build time without VULKAN_SDK when vulkan is on).
# CI enables this only for the Windows release build, where it installs the SDK.
# At runtime ggml auto-selects the GPU and falls back to CPU when none is present.
gpu-vulkan = ["scribble/vulkan"]

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[target.'cfg(target_os = "linux")'.dependencies]
# Match the webkit2gtk version pinned by wry.
webkit2gtk = { version = "=2.0.2", features = ["v2_38"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Build whisper.cpp with the Metal backend so transcription runs on the GPU
# (Apple Silicon and Intel Macs), falling back to CPU when no Metal device is
# present. whisper-rs defaults use_gpu=true once any GPU backend is compiled in,
# so scribble's default WhisperContextParameters pick this up with no code change.
scribble = { version = "0.5.4", features = ["metal"] }

[target.'cfg(target_os = "ios")'.dependencies]
tauri-plugin-apple-compliance = { path = "plugins/tauri-plugin-apple-compliance" }

[profile.dev.package.scrypt]
opt-level = 3

# Fork carrying the Windows MSVC compilation fix (whisper logging hooks) plus
# Opts.abort_signal for cancelling in-flight whisper runs. Pinned to a branch so
# a clean checkout (CI) resolves it without any local patch step.
[patch.crates-io]
tauri-plugin-scoped-storage = { git = "https://github.com/myelin-notes/tauri-plugin-scoped-storage.git", rev = "02572c6891221b311091e69963bda7565a6d8c11" }
scribble = { git = "https://github.com/myelin-notes/scribble", branch = "feat/abort-signal-upstream" }
