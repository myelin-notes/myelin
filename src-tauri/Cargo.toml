[package]
name = "myelin"
version = "0.0.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "myelin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "io-util", "sync", "macros", "time", "process"] }
tauri-plugin-mcp-bridge = "0.10"
tauri-plugin-ocr = { path = "plugins/tauri-plugin-ocr" }
tauri-plugin-stronghold = "2"
tauri-plugin-http = "2"
iroh = "0.97.0"
iroh-gossip = "0.97.0"
iroh-tickets = "0.4.0"
bytes = "1"
n0-future = "0.3.2"
sha2 = "0.10.9"
krilla = { version = "0.8.1", features = ["pdf"] }
base64 = "0.22.1"
yrs = "0.26.0"
scribble = "0.5.4"
candle-core = "0.10"
candle-nn = "0.10"
candle-transformers = "0.10"
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[features]
# Opt-in GPU acceleration via whisper.cpp's Vulkan backend. Kept off by default
# so ordinary local builds stay CPU-only and don't require the Vulkan SDK
# (whisper-rs-sys panics at build time without VULKAN_SDK when vulkan is on).
# CI enables this only for the Windows release build, where it installs the SDK.
# At runtime ggml auto-selects the GPU and falls back to CPU when none is present.
gpu-vulkan = ["scribble/vulkan"]

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[target.'cfg(target_os = "linux")'.dependencies]
# Match the webkit2gtk version pinned by wry.
webkit2gtk = { version = "=2.0.2", features = ["v2_38"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Build whisper.cpp with the Metal backend so transcription runs on the GPU
# (Apple Silicon and Intel Macs), falling back to CPU when no Metal device is
# present. whisper-rs defaults use_gpu=true once any GPU backend is compiled in,
# so scribble's default WhisperContextParameters pick this up with no code change.
scribble = { version = "0.5.4", features = ["metal"] }

[profile.dev.package.scrypt]
opt-level = 3

# Embedding inference (candle BERT) is unusably slow at the dev default of
# opt-level 0. Optimize the embedding crates and the gemm matmul kernels they
# call (the hot f32 loop lives in gemm-f32 / gemm-common, not the gemm facade).
# These are external deps that don't change, so they compile once and cache.
[profile.dev.package.candle-core]
opt-level = 3
[profile.dev.package.candle-nn]
opt-level = 3
[profile.dev.package.candle-transformers]
opt-level = 3
[profile.dev.package.gemm]
opt-level = 3
[profile.dev.package.gemm-common]
opt-level = 3
[profile.dev.package.gemm-f32]
opt-level = 3
[profile.dev.package.half]
opt-level = 3

# Fork carrying the Windows MSVC compilation fix (whisper logging hooks) plus
# Opts.abort_signal for cancelling in-flight whisper runs. Pinned to a branch so
# a clean checkout (CI) resolves it without any local patch step.
[patch.crates-io]
scribble = { git = "https://github.com/myelin-notes/scribble", branch = "feat/abort-signal-upstream" }
