[package]
name = "tauri-plugin-handwriting"
version = "0.1.0"
edition = "2021"
links = "tauri-plugin-handwriting"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
png = "0.18.1"

[target.'cfg(target_vendor = "apple")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSData", "NSDictionary", "NSError", "NSString"] }
objc2-vision = { version = "0.3", default-features = false, features = ["std", "VNObservation", "VNRequest", "VNRecognizeTextRequest", "VNRequestHandler", "VNTypes"] }
